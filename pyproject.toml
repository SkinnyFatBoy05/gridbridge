[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridbridge"
version = "0.1.0"
description = "Synthetic utility data onboarding control plane"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kishore Srinivasan" }]
dependencies = [
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9,<2",
  "duckdb>=1.3,<2",
  "jinja2>=3.1,<4",
  "networkx>=3.4,<4",
  "polars>=1.30,<2",
  "pyarrow>=23.0.1,<26",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "tzdata>=2025.2",
]

[project.scripts]
gridbridge = "gridbridge.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "types-networkx>=3.6,<4",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gridbridge"]
