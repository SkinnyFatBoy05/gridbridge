services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_only
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-db:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:3.0.6-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_only@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: -e /opt/airflow/gridbridge
    command: airflow db migrate
    volumes: &airflow-volumes
      - ./:/opt/airflow/gridbridge
      - ./airflow/dags:/opt/airflow/dags
      - ./work:/opt/airflow/work

  airflow-api-server:
    image: apache/airflow:3.0.6-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: api-server
    ports:
      - "8080:8080"
    volumes: *airflow-volumes

  airflow-scheduler:
    image: apache/airflow:3.0.6-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: scheduler
    volumes: *airflow-volumes

volumes:
  airflow-db:
